services:
  - type: web
    name: testsubject-school-erp
    runtime: php
    region: singapore
    plan: free
    buildCommand: "composer install --no-dev --optimize-autoloader && npm install --legacy-peer-deps && npm run build && php artisan storage:link"
    startCommand: "php artisan migrate --force && php artisan db:seed --force && php artisan serve --host 0.0.0.0 --port $PORT"
    envVars:
      - key: APP_NAME
        value: "Test Subject Higher Secondary School"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: /var/data/database.sqlite
      - key: SESSION_DRIVER
        value: cookie
      - key: CACHE_STORE
        value: file
    disk:
      name: erp-sqlite-data
      mountPath: /var/data
      sizeGB: 1
